          - Exact: [4096, 512, 1, 1024]  # 16WG x 2WG (MT256x256) N
          - Exact: [4096, 1024, 1, 1024]  # 16WG x 4WG (MT256x256) NO PAD
          - Exact: [4096, 1536, 1, 1024]  # 16WG x 6WG (MT256x256) N
          - Exact: [3584, 3584, 1, 1024]  # 30WG x 14WG (MT256x256) M N
          - Exact: [4096, 4096, 1, 1024]  # 16WG x 16WG (MT256x256) NO PAD

          - Exact: [4096, 512, 1, 4096]  # 16WG x 2WG (MT256x256) N
          - Exact: [4096, 1024, 1, 4096]  # 16WG x 4WG (MT256x256) NO PAD
          - Exact: [4096, 1536, 1, 4096]  # 16WG x 6WG (MT256x256) N
          - Exact: [3584, 3584, 1, 4096]  # 30WG x 14WG (MT256x256) M N
          - Exact: [4096, 4096, 1, 4096]  # 16WG x 16WG (MT256x256) NO PAD

