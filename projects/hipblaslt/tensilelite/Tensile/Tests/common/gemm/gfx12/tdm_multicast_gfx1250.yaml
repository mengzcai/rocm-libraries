TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported by arch
GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: 1 #至少要1才會跑perf counter
  KernelTime: True
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  ValidationMaxToPrint: 4      # maximum number of mismatches to print
  ValidationPrintValids: False # print matches too
  PruneSparseMode: 0
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeD: 0
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  # PrintTensorC: 1
  # PrintTensorD: 1
  # PrintTensorRef: 1
  NumWarmups: 10
  EnqueuesPerSync: 3
  # For IcacheRotateCopies
  RotatingBufferSize: 1024   # MB; max size ~57MB x 10 warmups = 569MB < 1GB
  IcacheRotateCopies: -1
  PrintWinnersOnly: False
  Architecture: gfx1250
  CpuThreads: 1
  KeepBuildTmp: True
  PrintLevel: 2
  ForceGenerateKernel: [True]
 
BenchmarkProblems:
  -
    - # ProblemType, TN
      OperationType: GEMM
      DataType: F8
      MacDataTypeA: F8
      MacDataTypeB: F4
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate:  True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      SupportUserArgs: True
        #      MXBlockA: 32
        #      MXBlockB: 32
        #      StochasticRounding: True
 
    - # BenchmarkProblemSizeGroup - Standard
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [true]
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,   1, 1,  2,2 ]  # 32x32
        - DepthU: [256]
        - ClusterLocalRead: [0]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsPadMXSA: [0]
        - LdsPadMXSB: [0]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsBlockSizePerPadMXSA: [0]
        - LdsBlockSizePerPadMXSB: [0]
        - LdsPadMetadata: [0]
        - LDSTrInst: [False]
        - TDMInst: [3]
        - StaggerU: [0]
        - ScheduleIterAlg: [0]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [1]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - LocalReadVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - SourceSwap: [false]
        - DirectToVgprSparseMetadata: [false]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - DirectToVgprA: [False]
        - DirectToVgprB: [False]
        - WavefrontSize: [32]
        - ClusterDim: [[4, 4]]
        - ClusterMaskReduce: [False, True]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [1024, 320, 1, 1024]  # 32WG x 10WG (MT32x32) N
          - Exact: [1024, 384, 1, 1024]  # 32WG x 12WG (MT32x32) NO PAD
          - Exact: [1024, 448, 1, 1024]  # 32WG x 14WG (MT32x32) N
          - Exact: [960, 960, 1, 1024]   # 30WG x 30WG (MT32x32) M,N
          - Exact: [1024, 1024, 1, 1024] # 32WG x 32WG (MT32x32) NO PAD

          - Exact: [1024, 320, 1, 4096]  # 32WG x 10WG (MT32x32) N
          - Exact: [1024, 384, 1, 4096]  # 32WG x 12WG (MT32x32) NO PAD
          - Exact: [1024, 448, 1, 4096]  # 32WG x 14WG (MT32x32) N
          - Exact: [960, 960, 1, 4096]   # 30WG x 30WG (MT32x32) M,N
          - Exact: [1024, 1024, 1, 4096] # 32WG x 32WG (MT32x32) NO PAD



    - # BenchmarkProblemSizeGroup - Standard
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
