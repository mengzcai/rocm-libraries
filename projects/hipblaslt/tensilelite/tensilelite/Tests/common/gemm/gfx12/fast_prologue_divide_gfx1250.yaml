TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250-strict]

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: False
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeD: 3
  DataInitTypeScaleAlphaVec: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  NumWarmups: 0
  EnqueuesPerSync: 1
  Architecture: gfx1250

# FastPrologueDivide 0/1: f64 vs exact u32 divisions in the WorkGroupMapping prologue.
# WorkGroupMapping covers negative, 1, non-pow2 and pow2; DataParallel (persistent) and TPS None GSU1.

BenchmarkProblems:
  #######################################
  # TN - BF16, TDM, bias along M + ScaleAlphaVec + activation
  #######################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: B
      DestDataType: B
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      UseBias: 1
      BiasDataTypeList: [s, B]
      Activation: True
      ActivationType: hipblaslt_all
      UseScaleAlphaVec: 1

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - ClusterLocalRead: [0]
        - DirectToLdsMetadata: [0]
        - DtlPlusLdsBuf: [0]
        - ExpandPointerSwap: [False]
        - GlobalReadVectorWidthA: [1]
        - GlobalReadVectorWidthB: [1]
        - InitCIterWmma: [1]
        - LdsBlockSizePerPadMXSA: [0]
        - LdsBlockSizePerPadMXSB: [0]
        - LdsBlockSizePerPadMetadata: [0]
        - LdsPadMXSA: [0]
        - LdsPadMXSB: [0]
        - LocalReadVectorWidthA: [8]
        - LocalReadVectorWidthB: [8]
        - MXLoadInst: [TDM]
        - MXScaleFormat: [InMemorySwizzle]
        - MaxLDS: [327680]
        - MbskPrefetchMethod: [0]
        - MinGRIncPerMfma: [1]
        - PostLoopStoreInNll: [False]
        - PrefetchGlobalRead: [2]
        - ScheduleGROverBarrier: [0]
        - ScheduleIterAlg: [4]
        - SourceSwap: [True]
        - StaggerUStride: [512]
        - TDMInst: [3]
        - ThreadTile:
          - [1, 1]
        - TransposeLDS: [1]
        - UseCustomMainLoopSchedule: [0]
        - WavefrontSize: [32]
        - FastPrologueDivide: [0, 1]
        - WorkGroupMapping: [-4, 1, 5, 8]
        - Groups:
          -
            - MatrixInstruction: [16, 16, 32, 1, 1, 1, 1, 1, 1]
              WorkGroup: [16, 2, 1]
              DepthU: 256
              TileProcessingStrategy: DataParallel
              GlobalSplitU: 0
              GlobalSplitUAlgorithm: SingleBuffer
              VectorWidthA: 1
              VectorWidthB: 1
              StoreVectorWidth: 1
              LdsBlockSizePerPadA: 512
              LdsBlockSizePerPadB: 512
              LdsPadA: 8
              LdsPadB: 8
              LDSSegmentInterleave: 0
              HalfPLR: 0
              TDMIterateMode: 0
              MIArchVgpr: True
              AdaptiveGemm: 1
              CompactLoopStore: True
              ActivationFuncCall: False
            - MatrixInstruction: [16, 16, 32, 1, 1, 1, 1, 1, 1]
              WorkGroup: [16, 2, 1]
              DepthU: 256
              TileProcessingStrategy: None
              GlobalSplitU: 1
              GlobalSplitUAlgorithm: SingleBuffer
              VectorWidthA: 1
              VectorWidthB: 1
              StoreVectorWidth: 1
              LdsBlockSizePerPadA: 512
              LdsBlockSizePerPadB: 512
              LdsPadA: 8
              LdsPadB: 8
              LDSSegmentInterleave: 0
              HalfPLR: 0
              TDMIterateMode: 0
              MIArchVgpr: True
              AdaptiveGemm: 1
              CompactLoopStore: True
              ActivationFuncCall: False
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [16, 16, 1, 32]
          - Exact: [17, 15, 1, 255]
          - Exact: [1, 1, 1, 1]
          - Exact: [720, 432, 1, 16]
          - Exact: [1031, 97, 1, 1000]
          - Exact: [96, 80, 3, 300]
          - Exact: [4100, 8, 1, 64]
        - BiasTypeArgs: ['s']
        - ActivationArgs:
          - [Enum: none]
